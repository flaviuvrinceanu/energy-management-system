version: "3.8"

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [net]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks: [net]

  auth:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    ports:
      - "8001:8001"  
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/energy_auth
      USERS_URL: http://users:8002
      DEVICES_URL: http://devices:8003
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-120}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth-docs.rule=Path(`/auth/docs`) || Path(`/auth/openapi.json`) || Path(`/auth/redoc`)
      - traefik.http.routers.auth-docs.entrypoints=web
      - traefik.http.routers.auth-docs.priority=100
      - traefik.http.routers.auth-docs.service=auth
      - traefik.http.middlewares.auth-docs-replace.replacepathregex.regex=^/auth(.*)
      - traefik.http.middlewares.auth-docs-replace.replacepathregex.replacement=$$1
      - traefik.http.routers.auth-docs.middlewares=auth-docs-replace
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.routers.auth.priority=10
      - traefik.http.middlewares.auth-stripprefix.stripPrefix.prefixes=/auth
      - traefik.http.routers.auth.middlewares=auth-stripprefix
      - traefik.http.services.auth.loadbalancer.server.port=8001

  users:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    ports:
      - "8002:8002"  
    environment:
      USERS_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/energy_users
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/energy_users
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.userssvc.rule=PathPrefix(`/usersvc`)
      - traefik.http.routers.userssvc.entrypoints=web
      - traefik.http.services.userssvc.loadbalancer.server.port=8002

  devices:
    build:
      context: .
      dockerfile: device_service/Dockerfile
    ports:
      - "8003:8003"  
    environment:
      DEVICES_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/energy_devices
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.devices.rule=PathPrefix(`/devicesvc`)
      - traefik.http.routers.devices.entrypoints=web
      - traefik.http.middlewares.devices-stripprefix.stripPrefix.prefixes=/devicesvc
      - traefik.http.routers.devices.middlewares=devices-stripprefix
      - traefik.http.services.devices.loadbalancer.server.port=8003

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"  
    environment:
      AUTH_URL: http://auth:8001
      USERS_URL: http://users:8002
      DEVICES_URL: http://devices:8003
      JWT_SECRET: ${JWT_SECRET}
      MONITORING_URL: http://monitoring:8004
      SUPPORT_URL: http://support:8005
      WEBSOCKET_URL: http://websocket:8006
    depends_on: [auth, users, devices, monitoring, support, websocket]
    networks: [net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.gateway.rule=PathPrefix(`/api`)
      - traefik.http.routers.gateway.entrypoints=web
      - traefik.http.services.gateway.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:80
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - gateway
    networks: [net]

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"   
      - "15672:15672" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [net]

  load_balancer:
    build:
      context: .
      dockerfile: load_balancer_service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      NUM_REPLICAS: 3
      LOAD_STRATEGY: ${LOAD_STRATEGY:-round-robin} 
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [net]

  monitoring:
    build:
      context: .
      dockerfile: monitoring_service/Dockerfile  
    ports:
      - "8004:8004"
    environment:
      MONITORING_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/energy_monitoring
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      INGEST_QUEUE: ingest_queue_1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      load_balancer:
        condition: service_started
    networks: [net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.monitoring.rule=PathPrefix(`/monitoring`)
      - traefik.http.routers.monitoring.entrypoints=web
      - traefik.http.middlewares.monitoring-stripprefix.stripPrefix.prefixes=/monitoring
      - traefik.http.routers.monitoring.middlewares=monitoring-stripprefix
      - traefik.http.services.monitoring.loadbalancer.server.port=8004

  monitoring2:
    build:
      context: .
      dockerfile: monitoring_service/Dockerfile
    environment:
      MONITORING_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/energy_monitoring
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      INGEST_QUEUE: ingest_queue_2
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      load_balancer:
        condition: service_started
    networks: [net]

  monitoring3:
    build:
      context: .
      dockerfile: monitoring_service/Dockerfile
    environment:
      MONITORING_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/energy_monitoring
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      INGEST_QUEUE: ingest_queue_3
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      load_balancer:
        condition: service_started
    networks: [net]

  support:
    build:
      context: .
      dockerfile: customer_support_service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.support.rule=PathPrefix(`/support`)
      - traefik.http.routers.support.entrypoints=web
      - traefik.http.middlewares.support-stripprefix.stripPrefix.prefixes=/support
      - traefik.http.routers.support.middlewares=support-stripprefix
      - traefik.http.services.support.loadbalancer.server.port=8005

  websocket:
    build:
      context: .
      dockerfile: websocket_service/Dockerfile
    ports:
      - "8006:8006"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      JWT_SECRET: ${JWT_SECRET}
      SUPPORT_SERVICE_URL: http://support:8005
    depends_on:
      rabbitmq:
        condition: service_healthy
      support:
        condition: service_started
    networks: [net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.websocket.rule=PathPrefix(`/ws`)
      - traefik.http.routers.websocket.entrypoints=web
      - traefik.http.services.websocket.loadbalancer.server.port=8006

volumes:
  dbdata:
  rabbitmq_data:

networks:
  net:
    driver: bridge